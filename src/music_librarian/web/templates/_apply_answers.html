{% from "_macros.html" import icon %}
{% macro apply_form(t, ctx, csrf, command) -%}
{% if ctx.requests %}
<form method="post" action="{{ url_for('new_pass') }}" class="inline">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <input type="hidden" name="command" value="{{ command }}">
    <button type="submit">{{ icon('preview') }}{{ t.apply_answers }} (<code>{{ command }}</code>)</button>
</form>
{% endif %}
{%- endmacro %}

{% macro apply_row(t, ctx, csrf, command) -%}
{% if ctx.requests %}<div class="actions review-tools">{{ apply_form(t, ctx, csrf, command) }}</div>{% endif %}
{%- endmacro %}
