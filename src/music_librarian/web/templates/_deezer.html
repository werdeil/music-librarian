{# The overview's Deezer download, shown once its keys are set: a button beside the upload's. #}
{% set deezer_off = not ctx.apply or not deezer_ready %}
<form method="post" action="{{ url_for('deezer_download') }}" class="deezer">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <button type="button" data-opens-dialog{% if deezer_off %} disabled{% endif %}>{{ m.icon('upload') }}{{ t.deezer_title }}</button>
    {% if not deezer_off %}
    <dialog class="pass-dialog deezer-dialog">
        <h3>{{ t.deezer_title }}</h3>
        <p class="pass-sub">{{ t.deezer_help }}</p>
        <label>{{ t.deezer_item }} <input type="text" name="item" required inputmode="url" autocomplete="off"
            autofocus placeholder="{{ t.deezer_placeholder }}"></label>
        <div class="actions">
            <button type="submit" class="primary">{{ m.icon('upload') }}{{ t.deezer_button }}</button>
            <button type="button" data-closes-dialog>{{ m.icon('cancel') }}{{ t.cancel_button }}</button>
        </div>
    </dialog>
    {% endif %}
</form>
