# Construction (les tests tournent au build) :
#   docker buildx bake -f docker-compose.yml --allow network.host
#
# En continu, le conteneur surveille l'Inbox et importe, et range chaque nuit
# les dossiers modifiés (music-ranger watch) :
#   docker compose up -d
#   journalctl -t music-ranger -f         # logs
#   docker compose down                   # arrêt (finit l'opération en cours)
#
# Lancements à la main, en dry-run sans --apply :
#   docker compose run --rm music-ranger import
#   docker compose run --rm music-ranger range --since
#   docker compose run --rm music-ranger enrich
#   docker compose run --rm music-ranger undo /state/journal/<date>.jsonl
#
# Créer ./state AVANT le premier lancement (mkdir state) : sinon Docker le crée
# en root et le conteneur (uid 1000) ne peut pas y écrire.
services:
  music-ranger:
    build:
      context: .
      # le DNS de mimosa est le Pi-hole sur 127.0.0.1, injoignable depuis le
      # réseau de build par défaut. Compose v5 ne sait pas accorder ce
      # privilège (« docker compose build » échoue) : construire avec bake.
      network: host
    image: music-ranger:local
    # import à chaque dépôt, chaque nuit le rangement des dossiers modifiés
    # (tags édités depuis le Mac), chaque dimanche l'enrichissement de ce qui
    # manque (gain, pochettes, paroles publiées depuis l'import)
    command: [watch, --apply, --range-at, "02:00", --enrich-at, "dim 03:00"]
    restart: unless-stopped
    user: "1000:1000"           # fichiers à werdeil, modifiables via Samba
    environment:
      - TZ=Europe/Paris         # date des dossiers _traités/AAAA-MM-JJ
      # historique LMS (lectures, notes) reporté sur les fichiers déplacés ;
      # LMS voit la bibliothèque sous un autre chemin (/opt/stacks/lyrion)
      - LMS_PERSIST_DB=/lms-prefs/persist.db
      - LMS_MUSIC_ROOT=/media/internal_drive/Musique
      # paroles : fournisseurs essayés dans l'ordre (lyrics.py)
      - LYRICS_PROVIDERS=lrclib,musixmatch,netease
      # - MUSIXMATCH_TOKEN=
      # - LRCLIB_TIMEOUT=15
    volumes:
      # Un seul montage pour l'Inbox et la bibliothèque, au même chemin que sur
      # l'hôte : les déplacements restent des renommages (pas de copie), les
      # liens physiques marchent, et les chemins des journaux sont valables
      # dans le conteneur comme sur l'hôte.
      - /media/werdeil/internal_drive:/media/werdeil/internal_drive
      # journaux, last_run et verrou, partagés avec les lancements sur l'hôte
      - ./state:/state
      # le dossier entier : SQLite y écrit aussi persist.db-wal et -shm
      - /opt/stacks/lyrion/data/prefs:/lms-prefs
    # docker stop envoie SIGTERM : laisser le temps de finir la conversion ou
    # le rangement en cours (10 s par défaut)
    stop_grace_period: 2m
    logging:
      driver: journald
      options:
        tag: music-ranger
