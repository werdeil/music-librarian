# Configuration: copy .env.example to .env and adapt it.
#
# Build (the tests run at build time):
#   docker compose build
#   (with BUILD_NETWORK=host: docker buildx bake -f docker-compose.yml --allow network.host)
#
# Continuously, the container watches the Inbox and imports, and files the
# changed folders every night (music-librarian watch), with its dashboard on
# http://<host>:8080 (WEB_PORT in .env):
#   docker compose up -d
#   journalctl -t music-librarian -f     # logs
#   docker compose down                  # stop (finishes the current operation)
#
# Manual runs, dry run without --apply:
#   docker compose run --rm music-librarian import
#   docker compose run --rm music-librarian organize --since
#   docker compose run --rm music-librarian enrich
#   docker compose run --rm music-librarian scan   # refresh the metadata cache
#   docker compose run --rm music-librarian split
#   docker compose run --rm music-librarian dedupe --review
#   docker compose run --rm music-librarian undo /state/journal/<date>.jsonl
#
# Create ./state BEFORE the first start (mkdir state): otherwise Docker creates
# it as root and the container cannot write to it.
services:
  music-librarian:
    build:
      context: .
      # Compose cannot grant the host network at build time: with host, build
      # with bake (see above)
      network: ${BUILD_NETWORK:-default}
    image: music-librarian:local
    # import on every drop, nightly filing of the changed folders, Sunday
    # enrichment of what is missing
    command: [watch, --apply, --organize-at, "02:00", --enrich-at, "sun 03:00", --listen, "8080"]
    restart: unless-stopped
    # the dashboard has no authentication: keep this port on the home network
    ports:
      - "${WEB_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8080/health')"]
      interval: 1m
      timeout: 10s
      retries: 3
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      - TZ=${TZ:-UTC}  # date of the _done/YYYY-MM-DD folders
      - MUSIC_LIBRARIAN_ROOT=${MUSIC_LIBRARIAN_ROOT:?set it in .env}
      - MUSIC_LIBRARIAN_INBOX=${MUSIC_LIBRARIAN_INBOX:?set it in .env}
      # Lyrion history carried over to moved files, off without LYRION_PREFS_DIR
      - LYRION_PERSIST_DB=${LYRION_PREFS_DIR:+/lyrion-prefs/persist.db}
      - LYRION_MUSIC_ROOT=${LYRION_MUSIC_ROOT:-}
      - LYRICS_PROVIDERS=${LYRICS_PROVIDERS:-lrclib,netease}
      - MUSIXMATCH_TOKEN=${MUSIXMATCH_TOKEN:-}
    volumes:
      # Inbox and library under this single mount, at the same path as on the
      # host: moves stay renames and journal paths are valid on both sides.
      - ${MUSIC_LIBRARIAN_VOLUME:?set it in .env}:${MUSIC_LIBRARIAN_VOLUME}
      - ./state:/state
      # the whole folder: SQLite also writes persist.db-wal and -shm there;
      # without Lyrion, ./state is mounted instead and left unused
      - ${LYRION_PREFS_DIR:-./state}:/lyrion-prefs
    # docker stop sends SIGTERM: leave time to finish the current conversion
    # or filing (10 s by default)
    stop_grace_period: 2m
    logging:
      driver: journald
      options:
        tag: music-librarian
