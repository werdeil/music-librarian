# Cuts a release from the Actions tab: sets __version__ on main, tags it and
# opens a draft GitHub release with generated notes. Publishing that draft
# fires publish.yml, which pushes the versioned image.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the leading v (e.g. 0.2.0)"
        required: true
        type: string
      prerelease:
        description: "Mark the release as a pre-release"
        required: false
        default: false
        type: boolean

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version '$VERSION' is not X.Y.Z"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$VERSION" > /dev/null; then
            echo "::error::tag v$VERSION already exists"
            exit 1
          fi
      - name: Set __version__, commit and tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          init=src/music_librarian/__init__.py
          sed -i -E "s/^__version__ = \".*\"$/__version__ = \"$VERSION\"/" "$init"
          grep -qx "__version__ = \"$VERSION\"" "$init" || { echo "::error::cannot set __version__ in $init"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- "$init"; then
            git commit -m "chore: release v$VERSION" -- "$init"
            git push origin HEAD:main
          fi
          git tag "v$VERSION"
          git push origin "v$VERSION"
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          args=(--draft --generate-notes --verify-tag --title "v$VERSION")
          if [ "$PRERELEASE" = "true" ]; then args+=(--prerelease); fi
          gh release create "v$VERSION" "${args[@]}"
          url=$(gh release view "v$VERSION" --json url --jq .url)
          printf '## Draft release v%s\n\nReview the notes, then publish it: %s\n' "$VERSION" "$url" >> "$GITHUB_STEP_SUMMARY"
