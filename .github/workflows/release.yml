# Cuts a release from the Actions tab: tags main at its __version__ and opens
# a draft GitHub release with generated notes. Publishing that draft fires
# publish.yml, which pushes the versioned image.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the leading v; empty for __version__ on main"
        required: false
        default: ""
        type: string
      prerelease:
        description: "Mark the release as a pre-release"
        required: false
        default: false
        type: boolean

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check the version and tag main
        id: version
        env:
          REQUESTED: ${{ inputs.version }}
        # main only takes pull requests, so __version__ is bumped through one beforehand.
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/music_librarian/__init__.py)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::__version__ '$version' is not X.Y.Z"
            exit 1
          fi
          if [ -n "$REQUESTED" ] && [ "$REQUESTED" != "$version" ]; then
            echo "::error::main is at __version__ $version, not $REQUESTED: bump it through a pull request first"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
            echo "::error::tag v$version already exists: bump __version__ through a pull request first"
            exit 1
          fi
          git tag "v$version"
          git push origin "v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          args=(--draft --generate-notes --verify-tag --title "v$VERSION")
          if [ "$PRERELEASE" = "true" ]; then args+=(--prerelease); fi
          gh release create "v$VERSION" "${args[@]}"
          url=$(gh release view "v$VERSION" --json url --jq .url)
          printf '## Draft release v%s\n\nReview the notes, then publish it: %s\n' "$VERSION" "$url" >> "$GITHUB_STEP_SUMMARY"
