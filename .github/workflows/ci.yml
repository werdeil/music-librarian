# Lint and tests on every pull request and every push to main.
#   lint  : pylint (rules and exceptions documented in pyproject.toml), and ESLint
#           on the dashboard's scripts (eslint.config.mjs);
#   tests : pytest on the GitHub runner (Ubuntu's ffmpeg), fast;
#   image : the tests rerun in the container (the Dockerfile's test stage),
#           then the image build, which checks the tools (a file really gets
#           a ReplayGain, --help of the cover and lyrics modules).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            pyproject.toml
      - run: pip install -r requirements-dev.txt -e .
      - run: pylint src tests
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npx --yes eslint@9 src/music_librarian/web/static/*.js

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            pyproject.toml
      - name: ffmpeg (audio files for the tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pip install -r requirements-dev.txt -e .
      - run: python -m pytest -q

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Run the tests in the container
        uses: docker/build-push-action@v7
        with:
          context: .
          target: test
          push: false
          cache-from: |
            type=gha
            type=gha,scope=test
          cache-to: type=gha,scope=test,mode=max
      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
