# Lint et tests à chaque push et pull request.
#   lint  : pylint (règles et exceptions documentées dans .pylintrc) ;
#   tests : pytest sur la machine GitHub (ffmpeg de Ubuntu), rapide ;
#   image : construction de l'image Docker, qui rejoue les tests dans le
#           conteneur et vérifie les outils (r128gain analyse vraiment un
#           fichier, --help des scripts de pochettes et de paroles).
# Sur mimosa, le build passe par « docker buildx bake --allow network.host »
# à cause du DNS (Pi-hole sur 127.0.0.1) ; ici le réseau par défaut suffit.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pylint *.py music-ranger tests

  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: ffmpeg (fichiers audio des tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q tests

  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Construction de l'image (tests compris)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
