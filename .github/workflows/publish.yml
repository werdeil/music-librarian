# Publishes the Docker image to the GitHub Container Registry, built for amd64
# and arm64 with the tests run on both (arm64 through QEMU, slower):
#   - publishing a GitHub release (see release.yml) tags it 0.1.0, 0.1 and
#     latest, only 0.1.0 for a pre-release;
#   - every push to main (or a manual run on main) tags it dev.
name: Publish

on:
  release:
    types: [published]
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

jobs:
  image:
    if: github.event_name == 'release' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag against the package version
        if: github.event_name == 'release'
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/music_librarian/__init__.py)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match __version__ $version"
            exit 1
          fi
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # The pre-release flag lives on the GitHub release, not the tag: latest=auto cannot see it.
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !github.event.release.prerelease }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}
            type=raw,value=dev,enable=${{ github.event_name != 'release' }}
      - name: Build and push the image (tests included)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Summarise
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: printf '## Image published\n\n```\n%s\n```\n' "$TAGS" >> "$GITHUB_STEP_SUMMARY"
