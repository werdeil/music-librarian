organize:
  - changed-files:
      - any-glob-to-any-file: ["src/music_librarian/organize/**"]

import:
  - changed-files:
      - any-glob-to-any-file: ["src/music_librarian/importer.py"]

watch:
  - changed-files:
      - any-glob-to-any-file: ["src/music_librarian/watch.py"]

enrich:
  - changed-files:
      - any-glob-to-any-file: ["src/music_librarian/enrich/**", "src/music_librarian/media/**"]

split:
  - changed-files:
      - any-glob-to-any-file: ["src/music_librarian/split/**", "src/music_librarian/media/credit_tags.py"]

dedupe:
  - changed-files:
      - any-glob-to-any-file: ["src/music_librarian/dedupe/**"]

lyrics:
  - changed-files:
      - any-glob-to-any-file: ["src/music_librarian/lyrics/**", "src/music_librarian/enrich/lyrics.py"]

